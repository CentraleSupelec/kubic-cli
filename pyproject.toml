[build-system]
requires = [
    "setuptools>=61",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "kubic-cli"
version = "0.1.0"
description = "CLI tool to bootstrap projects on a Kubic (Argo CD + Vault) cluster"
authors = [
    { name = "Votre Nom", email = "you@example.com" }
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["kubernetes", "argocd", "vault", "cli", "gitops"]
requires-python = ">=3.10"
dependencies = [
    "typer[all]==0.9.0",
    "PyYAML==6.0.1",
    "click>=8.1.7,<8.2.0",
    "requests>=2.31.0",
    "Jinja2>=3.1.2",
    "tomli>=2.0.1"
]

[project.scripts]
kubic-cli = "kubic_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["kubic_cli*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pylint>=3.0.0"
] 